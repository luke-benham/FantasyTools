name: refresh

# Times are UTC. Central time is UTC-5 until Nov 1, then UTC-6; the two Sunday runs cover both.
on:
  schedule:
    - cron: "0 12 * * *"     # daily ~7:00 am CT: market, trending, injuries, rankings
    - cron: "30 2 * * 3"     # Tue ~9:30 pm CT (after MNF): values, waivers, trade data
    - cron: "0 20 * * 4"     # Thu ~3:00 pm CT: weekly projections for TNF
    - cron: "45 15 * * 0"    # Sun 10:45 am CDT, after inactives
    - cron: "45 16 * * 0"    # Sun 10:45 am CST (and a second pass in CDT)
  workflow_dispatch:          # "Run workflow" button, e.g. mid-week trade checks
  push:
    branches: [main]
    paths: ["inputs/**", "engine/**", "site/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # reruns build on the latest main, not the commit that first triggered them
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data
        run: python -m engine.build
      - name: Commit data and snapshots
        run: |
          git config user.name "front-office-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Generated files always win: park them, move to the newest main, put them back, commit.
          tmp=$(mktemp -d)
          cp -r site/data "$tmp/data"
          cp -r snapshots "$tmp/snapshots"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            rm -rf site/data && cp -r "$tmp/data" site/data
            cp -r "$tmp/snapshots/." snapshots/
            git add site/data snapshots
            git diff --cached --quiet && break
            git commit -q -m "Refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && break
            sleep 5
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
