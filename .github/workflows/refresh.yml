name: refresh

# Times are UTC. Central time is UTC-5 until Nov 1, then UTC-6; the two Sunday runs cover both.
on:
  schedule:
    - cron: "0 12 * * *"     # daily ~7:00 am CT: market, trending, injuries, rankings
    - cron: "30 2 * * 3"     # Tue ~9:30 pm CT (after MNF): values, waivers, trade data
    - cron: "0 20 * * 4"     # Thu ~3:00 pm CT: weekly projections for TNF
    - cron: "45 15 * * 0"    # Sun 10:45 am CDT, after inactives
    - cron: "45 16 * * 0"    # Sun 10:45 am CST (and a second pass in CDT)
  workflow_dispatch:          # "Run workflow" button, e.g. mid-week trade checks
  push:
    branches: [main]
    paths: ["inputs/**", "engine/**", "site/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data
        run: python -m engine.build
      - name: Commit data and snapshots
        run: |
          git config user.name "front-office-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
